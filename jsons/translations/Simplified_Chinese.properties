Present Current Time = 显示当前时间

A type of prion virus called 'Zed' has spread like wild fire across the states. It turns people into zombies. We are not sure if the countless media repersentation of this enemy counts as prophecy or not. But the government has collapsed immedately under the pressure of this virus. Aside from this cookie cutter zombie lore, do you have any idea who you are? = 一种名为"Zed"的朊病毒在全境如野火般蔓延。它会把人类变成丧尸。我们不确定那些数不清的丧尸题材媒体算不算预言。但政府在病毒冲击下瞬间崩溃。除了这些老套的丧尸设定，你知道自己是什么身份吗？
Ex-City Dwellers, nothin special. = 普通市民，没啥特别的。
I grew up in the barn, shut up. = 老子谷仓里长大的，少废话。
This is the US army. Punk. We have not collapsed yet. = 我们是美国陆军，混球。我们可还没垮。
Our Escape = 我们的逃亡

That doesnt matter too much I guess, but I have to tell you something really Season. The zombies mutates. They grow faster stronger weirder and you have to keep up. Every year have 4 seasons and if you build a [Farm] right how its going to only bear fruit in [Autumn]. Your only source of population growth will be the [Migrating Population] early on. Proper population growth asks for proper source of food and safe environment. Good luck. = 身份什么的可能不太重要，但有件事你得知道——丧尸会变异。它们越来越快、越来越强、越来越怪，你得跟上节奏。一年有四季，如果你造了[Farm]，它只在[Autumn]结果。前期你唯一的人口来源是[Migrating Population]。要想稳定增长人口，得有稳定的食物来源和安全的环境。祝你好运。
It is weird you talk this much about common phenomeon, but thanks for the reminder. = 你唠唠叨叨说这么多常识也是挺怪的，不过还是谢了。
Thank you for playing. = 感谢游玩。
Shut the fuck up. = 给老子闭嘴。
Our Escape 2 = 我们的逃亡 2

This might be the first time ever we see a uninfected horde. According to their leader, these people came from a small town attacked by the zombies. They've been stalking us for some times and we seems to be civilized enough. = 这可能是我们头一回见到一整群活人。据他们的头头说，这些人来自一个被丧尸袭击的小镇。他们已经暗中观察我们好一阵, 现在他们终于认为我们足够文明了。
More people more strength. = 人多力量大。
Accept all of their people to live in our settlement. Including the ill and the elderly. = 接纳所有人入住我们的聚居地，包括老弱病残。
This might have severe consequences. = 天有不测风云，这可能会带来意想不到的后果。
No way we are letting this many people in. = 我们不可能放这么多人进来。
Accept selected few people to live in our settlement. = 只挑一部分人入住我们的聚居地。
On second thoughts, we could estabilish a new settlement for them. = 转念一想，我们可以为他们建立一个新的聚居地。
Rob them. = 直接抢劫！
Refugees? = 难民？

We need to carefully choose our target of scavenge. Or else we might end up with a mess. = 我们需要谨慎选择搜刮目标，否则可能会搜到真垃圾。
Focus on Scavenging Ammunitions and Military Equipments = 重点搜刮弹药和军用装备
Focus on Scavenging Metals and Industrial Equipments. = 重点搜刮金属和工业设备
Losers cant be choosers, Winner wins all = 弱肉强食，赢家通吃
Scavenge Focus = 搜刮方针

We need to carefully choose our target of foraging or hunting. Or else we might end up with empty stomaches. = 我们需要谨慎选择觅食或狩猎的目标，否则就得饿肚子了。
Focus on the fields and gardens = 重点采集农田和菜园
Focus on Hunting = 重点狩猎
Focus on alternatively sourced foods = 重点寻找替代食物来源
Foraging Focus = 觅食方针

The Zed virus left us with a broken world and a broken society. How should we reorganise it? = Zed病毒留给我们一个破碎的世界和破碎的社会。我们该如何重新组织？
Focus on making new communities = 重点建设新的社区
Focus on the overall unity of our settlement = 重点维护聚居地的整体团结
Focus on order and enforcement = 重点维持秩序与执法
Our Society = 我们的社会

What Plan do you have to get your hand on a [Generator]? = 你打算怎么搞到一台[Generator]？
We need to initiate an expedition! = 我们需要组织一次远征！
There are ruined industrial area in our control, I think we can just dig up some there. = 我们控制区内就有废弃工业区，应该能就地挖掘一些。
The Search for the Generator = 寻觅发电机

What Plan do you have to get your hand on some [Seeds]s? = 你打算怎么弄到一些[Seeds]？
We need to venture into the wild! = 我们需要深入荒野！
We can venture into the city center to find those hobbist shops. = 我们可以冒险去市中心找找那些爱好者的店铺。
The Search for the Seed = 寻觅种子

We need to find dead survivors! = 我们看看尸体上面有没有多余的！
We can venture into the city center to find some military caches. = 没准市中心有军队留下的补给。 
The Search for the Ammunition = 寻觅弹药

We need to conduct a far and wide search. = 我们需要进行一次大范围搜索。
We are only able to afford little resources. = 我们只能承担少量资源支出。
It seems like we are stretched too thin = 看来我们摊子铺得太大了。

We were cautious about having new borns in our settlements because not only babies are fragile. They are also noisy. However, we knew that not having babies is civilizational suicide. Letting this future of extinction come to pass is unbearable. = 我们对在聚居地生育一直很谨慎，这是因为婴儿不仅弱不禁风还太吵了。但我们知道，不生孩子等于整个人类文明慢性自杀，而我们担不起让坐视不管的责任。
Proceed. = 那就干吧。
But we must do it. = 但我们必须这么做。
Proceed. With caution. = 那就干吧，但要谨慎。
More patrols around the settlement, Noise barriers, All that we could use... = 增加聚居地周边的巡逻、设置隔音屏障，能用的手段全用上……
Endless Possibilities = 无尽可能

They never leave us alone, dont they? = 它们从来不肯放过我们，对吧？
And so another fight begins! = 又一场战斗打响了！
Waves of Zombies! = 丧尸浪潮！

These zombies seems to become smarter day by day... = 这些丧尸似乎一天比一天聪明……
We need to get to the bottom of this. = 我们必须查个水落石出。
Zombie Units Appear near all of your settlements. = 所有聚居地附近都出现了丧尸单位。
Lower the possibility of future attacks by a little. Might need multiple endavors. = 略微降低未来袭击的概率。可能需要多次努力。
Special Infected Infiltration! = 特殊感染者渗透！

Suddenly, the settlement is under attack by some big ugly brutes! These towering mutated monstrosities are formidable and destructive. = 突然，聚居地遭到一群丑陋的大块头袭击！这些高大的变异怪物既凶猛又具有破坏性。
Brute Attack! = 巨兽来袭！

Turns out there are other infections we need to worry about. = 原来我们还需要担心其他传染病。
We must contain the flu. = 我们必须控制流感。
We must cure the flu. = 我们必须治愈流感。
Sick Refugees = 患病难民

So cliche, yet so deadly. Its a hidden fucking zombie bite. = 这么老套，却又这么致命——是一处隐蔽的丧尸咬伤。
We must... Kill. = 我们必须……处决。
Infected Refugees = 被感染难民

Our men had to raise both of their hands for this one, those camo suits are overreacting a lot. They say they've seen the worst of the Apocalypse and they are still not willing to trust anyone. Still rambling about muscle zombies and tounges... = 我们的人这次不得不举起双手投降，那些穿迷彩服的家伙反应过度了。他们说他们见过末日中最惨烈的景象，至今不愿相信任何人。还在絮絮叨叨什么肌肉丧尸和舌头……
We could just leave them alone = 我们可以不管他们。
Your men will not survive if you dont go with us! = 你们不跟我们走，你们的人就活不了！
Regroup! = 重新集结！
Military Survivors: Stories of the Camp = 军方幸存者：营地往事

We've discovered 4 survivors who said they came all the way from other states! That must be a long journey. = 我们发现了4名幸存者，他们说他们是从其他州一路过来的！那可是一段漫长的旅程。
Reality is stranger than fiction. = 现实比小说更离奇。
Join for Life? = 生死与共？
We are all badasses. = 我们都是狠角色。
Lone Survivors: Left for Dead = 独行幸存者：求生之路

Lots of smoke, no people, just crates of weapon lying around. = 浓烟滚滚，空无一人，只有成箱的武器散落一地。
Too good to be true. = 好得不像真的。
Gotta have the guns for the fun = 枪在手里，乐在其中。
Discarded Weapons = 遗弃的武器

Do we really have time for baseless accusations? They say we, the so called 'city folk' made the virus. = 我们真的有时间理会这些无端指责吗？他们说我们这些所谓的"城里人"制造了病毒。
Unreasonable men in a world that has gone mad. = 疯癫世界里的不可理喻之人。
Calm down there buddy. = 冷静点，老兄。
Everybodys down on luck pal. = 大家都不容易，朋友。
Rural Survivors: Anger Issues = 乡村幸存者：愤怒难平

We see a bunch of punk lads with nose rings, dyed hair and absolutly ridiculous outfits, raging their rides along the streets. = 我们看到一群戴着鼻环、染着头发、穿着奇装异服的小混混，在街上飙车狂飙。
I hate painted nails = 我讨厌涂指甲油。
Its rather dangerous to be in that situation. = 那种情况相当危险。
Luckily, We've got that type of people here. = 还好我们这儿也有这种人。
