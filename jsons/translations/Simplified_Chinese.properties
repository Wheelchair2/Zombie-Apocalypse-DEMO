Unfortunately, we had a absolutely terrible trip. Many died and only few return to tell the tale in terror. = 不幸的是，这次行动凶多吉少。死了很多人，只有极少数人活着回来讲述这场噩梦。
What in the sam hell is this? = 这他妈到底是什么情况？
Huge Casualties = 重大伤亡

Behold! The options below doesnt do anything, they just display what status you are in. = 注意！下面的选项只是显示当前状态，没有实际功能。
Spring = 春季
